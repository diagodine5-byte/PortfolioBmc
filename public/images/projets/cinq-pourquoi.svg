<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-label="Deux chaînes de cinq pourquoi remontant des retards de réparation jusqu'à l'absence de gestion des stocks et de cadre de priorisation">
  <defs>
    <style>
      .bg    { fill: #0E1B2A; }
      .ttl   { fill: #E8F0FA; font: 700 30px Helvetica, Arial, sans-serif; }
      .sub   { fill: #7E93AB; font: 400 17px Helvetica, Arial, sans-serif; }
      .prob  { fill: #3A1F2B; stroke: #C96A80; stroke-width: 2; }
      .probT { fill: #F2C9D3; font: 700 16px Helvetica, Arial, sans-serif; }
      .ptag  { fill: #C96A80; font: 600 11px Helvetica, Arial, sans-serif; letter-spacing: 1.2px; }
      .step  { fill: #16293D; stroke: #2B4761; stroke-width: 2; }
      .last  { fill: #152F3A; stroke: #8FD0A8; stroke-width: 2.5; }
      .stepT { fill: #BBCBDD; font: 400 13.5px Helvetica, Arial, sans-serif; }
      .lastT { fill: #CDEBD9; font: 600 13.5px Helvetica, Arial, sans-serif; }
      .badge { fill: #7E93AB; font: 700 12px Helvetica, Arial, sans-serif; }
      .arr   { stroke: #2B4761; stroke-width: 2; }
      .root  { fill: #8FD0A8; font: 600 11px Helvetica, Arial, sans-serif; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="790" rx="16" />

  <text class="ttl" x="60" y="60">Remonter aux causes par les cinq pourquoi</text>
  <text class="sub" x="60" y="90">Deux des chaînes d'analyse du projet · chaque réponse devient la question suivante</text>

  <!-- COLONNE 1 -->
  <rect class="prob" x="60" y="124" width="520" height="86" rx="12" />
  <text class="ptag"  x="82" y="150">PROBLÈME</text>
  <text class="probT" x="82" y="176">Les réparations sont retardées faute de</text>
  <text class="probT" x="82" y="196">pièces disponibles</text>

  <line class="arr" x1="320" y1="210" x2="320" y2="234" />
  <rect class="step" x="60" y="234" width="520" height="66" rx="10" />
  <text class="badge" x="82" y="262">1</text>
  <text class="stepT" x="108" y="272">Parce que les pièces ne sont pas disponibles rapidement</text>

  <line class="arr" x1="320" y1="300" x2="320" y2="320" />
  <rect class="step" x="60" y="320" width="520" height="66" rx="10" />
  <text class="badge" x="82" y="348">2</text>
  <text class="stepT" x="108" y="358">Parce qu'il n'y a pas de stock centralisé</text>

  <line class="arr" x1="320" y1="386" x2="320" y2="406" />
  <rect class="step" x="60" y="406" width="520" height="66" rx="10" />
  <text class="badge" x="82" y="434">3</text>
  <text class="stepT" x="108" y="444">Parce que les pièces sont commandées au cas par cas</text>

  <line class="arr" x1="320" y1="472" x2="320" y2="492" />
  <rect class="step" x="60" y="492" width="520" height="66" rx="10" />
  <text class="badge" x="82" y="520">4</text>
  <text class="stepT" x="108" y="530">Parce qu'il n'y a pas de planification des besoins</text>

  <line class="arr" x1="320" y1="558" x2="320" y2="578" />
  <rect class="last" x="60" y="578" width="520" height="80" rx="10" />
  <text class="root"  x="82" y="604">CAUSE FONDAMENTALE</text>
  <text class="lastT" x="82" y="630">Absence de gestion proactive des stocks</text>

  <!-- COLONNE 2 -->
  <rect class="prob" x="620" y="124" width="520" height="86" rx="12" />
  <text class="ptag"  x="642" y="150">PROBLÈME</text>
  <text class="probT" x="642" y="176">Les réparations ne sont pas traitées</text>
  <text class="probT" x="642" y="196">selon leur urgence</text>

  <line class="arr" x1="880" y1="210" x2="880" y2="234" />
  <rect class="step" x="620" y="234" width="520" height="66" rx="10" />
  <text class="badge" x="642" y="262">1</text>
  <text class="stepT" x="668" y="272">Parce que toutes les demandes sont traitées de la même manière</text>

  <line class="arr" x1="880" y1="300" x2="880" y2="320" />
  <rect class="step" x="620" y="320" width="520" height="66" rx="10" />
  <text class="badge" x="642" y="348">2</text>
  <text class="stepT" x="668" y="358">Parce qu'il n'y a pas de critères de priorité</text>

  <line class="arr" x1="880" y1="386" x2="880" y2="406" />
  <rect class="step" x="620" y="406" width="520" height="66" rx="10" />
  <text class="badge" x="642" y="434">3</text>
  <text class="stepT" x="668" y="444">Parce qu'il n'y a pas de classification des pannes</text>

  <line class="arr" x1="880" y1="472" x2="880" y2="492" />
  <rect class="step" x="620" y="492" width="520" height="66" rx="10" />
  <text class="badge" x="642" y="520">4</text>
  <text class="stepT" x="668" y="530">Parce que la gestion des tickets n'est pas structurée</text>

  <line class="arr" x1="880" y1="558" x2="880" y2="578" />
  <rect class="last" x="620" y="578" width="520" height="80" rx="10" />
  <text class="root"  x="642" y="604">CAUSE FONDAMENTALE</text>
  <text class="lastT" x="642" y="630">Absence de cadre de gestion des priorités</text>

  <text class="sub" x="60" y="716">Les deux chaînes convergent : le problème n'était pas le rythme des techniciens,</text>
  <text class="sub" x="60" y="742">mais l'absence de structure autour de leur travail.</text>
</svg>
