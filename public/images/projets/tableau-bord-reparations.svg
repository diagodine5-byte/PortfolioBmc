<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Reconstitution anonymisée du rapport : panneau des cinq pages à gauche, et page Vue d'ensemble à droite avec quatre indicateurs, deux graphiques et des segments">
  <defs>
    <style>
      .bg    { fill: #0E1B2A; }
      .ttl   { fill: #E8F0FA; font: 700 27px Helvetica, Arial, sans-serif; }
      .sub   { fill: #7E93AB; font: 400 14px Helvetica, Arial, sans-serif; }
      .rail  { fill: #132434; stroke: #2B4761; stroke-width: 2; }
      .navH  { fill: #7E93AB; font: 700 11px Helvetica, Arial, sans-serif; letter-spacing: 1.3px; }
      .navI  { fill: #16293D; }
      .navA  { fill: #1C3F60; }
      .navT  { fill: #9DB2C8; font: 400 13px Helvetica, Arial, sans-serif; }
      .navTA { fill: #E8F0FA; font: 700 13px Helvetica, Arial, sans-serif; }
      .bar5  { fill: #5BA8F5; }
      .card  { fill: #16293D; stroke: #2B4761; stroke-width: 2; }
      .panel { fill: #132434; stroke: #2B4761; stroke-width: 2; }
      .klab  { fill: #7E93AB; font: 400 12px Helvetica, Arial, sans-serif; text-anchor: middle; }
      .kval  { fill: #E8F0FA; font: 700 28px Helvetica, Arial, sans-serif; text-anchor: middle; }
      .kacc  { fill: #5BA8F5; font: 700 28px Helvetica, Arial, sans-serif; text-anchor: middle; }
      .kgrn  { fill: #8FD0A8; font: 700 28px Helvetica, Arial, sans-serif; text-anchor: middle; }
      .kwrn  { fill: #E8A34D; font: 700 28px Helvetica, Arial, sans-serif; text-anchor: middle; }
      .ptit  { fill: #BBCBDD; font: 600 14px Helvetica, Arial, sans-serif; }
      .blab  { fill: #9DB2C8; font: 400 11px Helvetica, Arial, sans-serif; text-anchor: end; }
      .xlab  { fill: #7E93AB; font: 400 9.5px Helvetica, Arial, sans-serif; text-anchor: middle; }
      .axis  { stroke: #2B4761; stroke-width: 1.5; }
      .chipR { fill: #1C3650; stroke: #2B4761; stroke-width: 1.5; }
      .chipT { fill: #BBCBDD; font: 600 12px Helvetica, Arial, sans-serif; text-anchor: middle; }
      .slab  { fill: #7E93AB; font: 600 10.5px Helvetica, Arial, sans-serif; letter-spacing: 1.1px; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700" rx="16" />

  <text class="ttl" x="60" y="46">Rapport de suivi des réparations — cinq pages</text>
  <text class="sub" x="60" y="72">Reconstitution anonymisée · établissements et marques masqués, valeurs illustratives</text>

  <!-- panneau de navigation -->
  <rect class="rail" x="60" y="96" width="230" height="526" rx="12" />
  <text class="navH" x="82" y="128">PAGES</text>

  <rect class="navA" x="72" y="144" width="206" height="44" rx="8" />
  <rect class="bar5" x="72" y="144" width="4" height="44" rx="2" />
  <text class="navTA" x="92" y="171">Vue d'ensemble</text>

  <rect class="navI" x="72" y="196" width="206" height="44" rx="8" />
  <text class="navT" x="92" y="223">Pièces brisées</text>

  <rect class="navI" x="72" y="248" width="206" height="44" rx="8" />
  <text class="navT" x="92" y="268">Pièces brisées</text>
  <text class="navT" x="92" y="284">par modèle</text>

  <rect class="navI" x="72" y="300" width="206" height="44" rx="8" />
  <text class="navT" x="92" y="320">Pièces brisées</text>
  <text class="navT" x="92" y="336">par établissement</text>

  <rect class="navI" x="72" y="352" width="206" height="44" rx="8" />
  <text class="navT" x="92" y="379">Délais de réparation</text>

  <text class="sub" x="82" y="430">La page active est</text>
  <text class="sub" x="82" y="450">reproduite à droite.</text>

  <!-- indicateurs -->
  <rect class="card" x="312" y="110" width="195" height="96" rx="12" />
  <text class="klab" x="409" y="142">Billets de réparation</text>
  <text class="kval" x="409" y="180">5 600</text>

  <rect class="card" x="523" y="110" width="195" height="96" rx="12" />
  <text class="klab" x="620" y="142">Délai moyen (j)</text>
  <text class="kacc" x="620" y="180">60</text>

  <rect class="card" x="734" y="110" width="195" height="96" rx="12" />
  <text class="klab" x="831" y="142">Établissements</text>
  <text class="kgrn" x="831" y="180">66</text>

  <rect class="card" x="945" y="110" width="195" height="96" rx="12" />
  <text class="klab" x="1042" y="142">Délai maximal (j)</text>
  <text class="kwrn" x="1042" y="180">880</text>

  <!-- graphique marques -->
  <rect class="panel" x="312" y="226" width="406" height="296" rx="12" />
  <text class="ptit" x="334" y="254">Billets par marque</text>

  <text class="blab" x="390" y="300">Marque A</text>
  <rect x="400" y="286" width="290" height="18" rx="3" fill="#5BA8F5" />

  <text class="blab" x="390" y="332">Autre</text>
  <rect x="400" y="318" width="97" height="18" rx="3" fill="#7FC4FF" />

  <text class="blab" x="390" y="364">Marque B</text>
  <rect x="400" y="350" width="89" height="18" rx="3" fill="#8FD0A8" />

  <text class="blab" x="390" y="396">Marque C</text>
  <rect x="400" y="382" width="24" height="18" rx="3" fill="#E8A34D" />

  <text class="blab" x="390" y="428">Marque D</text>
  <rect x="400" y="414" width="22" height="18" rx="3" fill="#C96A80" />

  <text class="blab" x="390" y="460">Marque E</text>
  <rect x="400" y="446" width="13" height="18" rx="3" fill="#B07FD0" />

  <line class="axis" x1="400" y1="476" x2="690" y2="476" />
  <text class="xlab" x="400" y="492">0</text>
  <text class="xlab" x="545" y="492">2 000</text>
  <text class="xlab" x="690" y="492">4 000</text>

  <!-- graphique etablissements -->
  <rect class="panel" x="734" y="226" width="406" height="296" rx="12" />
  <text class="ptit" x="756" y="254">Billets par établissement</text>

  <rect x="762"  y="304" width="22" height="160" rx="3" fill="#9B8BE0" />
  <rect x="792"  y="363" width="22" height="101" rx="3" fill="#9B8BE0" />
  <rect x="822"  y="365" width="22" height="99"  rx="3" fill="#9B8BE0" />
  <rect x="852"  y="374" width="22" height="90"  rx="3" fill="#9B8BE0" />
  <rect x="882"  y="379" width="22" height="85"  rx="3" fill="#9B8BE0" />
  <rect x="912"  y="427" width="22" height="37"  rx="3" fill="#9B8BE0" />
  <rect x="942"  y="430" width="22" height="34"  rx="3" fill="#9B8BE0" />
  <rect x="972"  y="432" width="22" height="32"  rx="3" fill="#9B8BE0" />
  <rect x="1002" y="444" width="22" height="20"  rx="3" fill="#9B8BE0" />
  <rect x="1032" y="446" width="22" height="18"  rx="3" fill="#9B8BE0" />
  <rect x="1062" y="447" width="22" height="17"  rx="3" fill="#9B8BE0" />
  <rect x="1092" y="449" width="22" height="15"  rx="3" fill="#9B8BE0" />

  <line class="axis" x1="752" y1="464" x2="1122" y2="464" />
  <text class="xlab" x="773"  y="480">1</text>
  <text class="xlab" x="803"  y="480">2</text>
  <text class="xlab" x="833"  y="480">3</text>
  <text class="xlab" x="863"  y="480">4</text>
  <text class="xlab" x="893"  y="480">5</text>
  <text class="xlab" x="923"  y="480">6</text>
  <text class="xlab" x="953"  y="480">7</text>
  <text class="xlab" x="983"  y="480">8</text>
  <text class="xlab" x="1013" y="480">9</text>
  <text class="xlab" x="1043" y="480">10</text>
  <text class="xlab" x="1073" y="480">11</text>
  <text class="xlab" x="1103" y="480">12</text>
  <text class="sub"  x="756"  y="504">Établissements anonymisés, classés par volume</text>

  <!-- segments -->
  <text class="slab" x="312" y="556">SEGMENT · ANNÉE</text>
  <rect class="chipR" x="312" y="568" width="72" height="36" rx="8" />
  <text class="chipT" x="348" y="591">2022</text>
  <rect class="chipR" x="394" y="568" width="72" height="36" rx="8" />
  <text class="chipT" x="430" y="591">2023</text>
  <rect class="chipR" x="476" y="568" width="72" height="36" rx="8" />
  <text class="chipT" x="512" y="591">2024</text>
  <rect class="chipR" x="558" y="568" width="72" height="36" rx="8" />
  <text class="chipT" x="594" y="591">2025</text>
  <rect class="chipR" x="640" y="568" width="72" height="36" rx="8" />
  <text class="chipT" x="676" y="591">2026</text>

  <text class="slab" x="734" y="556">SEGMENT · MARQUE</text>
  <rect class="chipR" x="734" y="568" width="92" height="36" rx="8" />
  <text class="chipT" x="780" y="591">Marque A</text>
  <rect class="chipR" x="836" y="568" width="92" height="36" rx="8" />
  <text class="chipT" x="882" y="591">Marque B</text>
  <rect class="chipR" x="938" y="568" width="92" height="36" rx="8" />
  <text class="chipT" x="984" y="591">Marque C</text>
  <rect class="chipR" x="1040" y="568" width="100" height="36" rx="8" />
  <text class="chipT" x="1090" y="591">Autre</text>

  <text class="sub" x="60" y="664">Les segments se propagent à l'ensemble des pages : une année ou une marque sélectionnée filtre tout le rapport.</text>
</svg>
