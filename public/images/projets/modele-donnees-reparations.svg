<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Modèle de données en étoile : les faits Billets et Pièces entourés des dimensions Date, Établissement, Modèle et Catégorie de pièce">
  <defs>
    <style>
      .bg   { fill: #0E1B2A; }
      .ttl  { fill: #E8F0FA; font: 700 30px Helvetica, Arial, sans-serif; }
      .sub  { fill: #7E93AB; font: 400 17px Helvetica, Arial, sans-serif; }
      .card { fill: #16293D; stroke: #2B4761; stroke-width: 2; }
      .fact { fill: #152F4A; stroke: #5BA8F5; stroke-width: 2.5; }
      .tag  { fill: #7E93AB; font: 600 11px Helvetica, Arial, sans-serif; letter-spacing: 1.2px; }
      .tagF { fill: #5BA8F5; font: 600 11px Helvetica, Arial, sans-serif; letter-spacing: 1.2px; }
      .nam  { fill: #E8F0FA; font: 700 18px Helvetica, Arial, sans-serif; }
      .fld  { fill: #9DB2C8; font: 400 13px Helvetica, Arial, sans-serif; }
      .mes  { fill: #8FD0A8; font: 400 13px Helvetica, Arial, sans-serif; }
      .lnk  { stroke: #2B4761; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="675" rx="16" />

  <text class="ttl" x="60" y="68">Modèle de données — suivi des réparations</text>
  <text class="sub" x="60" y="98">Schéma en étoile sur les données ITSM · deux tables de faits, quatre dimensions</text>

  <!-- relations -->
  <line class="lnk" x1="545" y1="222" x2="545" y2="310" />
  <line class="lnk" x1="885" y1="222" x2="885" y2="310" />
  <line class="lnk" x1="380" y1="380" x2="420" y2="380" />
  <line class="lnk" x1="545" y1="450" x2="545" y2="520" />
  <line class="lnk" x1="670" y1="380" x2="760" y2="380" />

  <!-- dimension date -->
  <rect class="card" x="420" y="130" width="250" height="92" rx="10" />
  <text class="tag" x="442" y="156">DIMENSION</text>
  <text class="nam" x="442" y="180">Date</text>
  <text class="fld" x="442" y="204">Jour · Mois · Année scolaire</text>

  <!-- dimension categorie -->
  <rect class="card" x="760" y="130" width="250" height="92" rx="10" />
  <text class="tag" x="782" y="156">DIMENSION</text>
  <text class="nam" x="782" y="180">Catégorie de pièce</text>
  <text class="fld" x="782" y="204">Affichage · Alimentation · Saisie…</text>

  <!-- dimension etablissement -->
  <rect class="card" x="150" y="334" width="230" height="92" rx="10" />
  <text class="tag" x="172" y="360">DIMENSION</text>
  <text class="nam" x="172" y="384">Établissement</text>
  <text class="fld" x="172" y="408">École · Ordre d'enseignement</text>

  <!-- faits billets -->
  <rect class="fact" x="420" y="310" width="250" height="140" rx="12" />
  <text class="tagF" x="442" y="338">TABLE DE FAITS</text>
  <text class="nam"  x="442" y="364">Billets</text>
  <text class="fld"  x="442" y="388">Création · Fermeture</text>
  <text class="mes"  x="442" y="410">Durée de traitement</text>
  <text class="mes"  x="442" y="432">Volume en file</text>

  <!-- faits pieces -->
  <rect class="fact" x="760" y="310" width="250" height="140" rx="12" />
  <text class="tagF" x="782" y="338">TABLE DE FAITS</text>
  <text class="nam"  x="782" y="364">Pièces remplacées</text>
  <text class="fld"  x="782" y="388">Pièce · Quantité</text>
  <text class="mes"  x="782" y="410">Volume par pièce</text>
  <text class="mes"  x="782" y="432">Répartition par catégorie</text>

  <!-- dimension modele -->
  <rect class="card" x="420" y="520" width="250" height="92" rx="10" />
  <text class="tag" x="442" y="546">DIMENSION</text>
  <text class="nam" x="442" y="570">Modèle</text>
  <text class="fld" x="442" y="594">Marque · Famille de modèle</text>

  <text class="sub" x="60" y="652">Les filtres se propagent des dimensions vers les faits, ce qui permet de croiser pièce, modèle, école et délai.</text>
</svg>
