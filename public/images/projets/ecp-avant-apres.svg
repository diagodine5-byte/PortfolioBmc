<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Efficience du processus portée de 0,45 % à 8 % au fil des six phases DMAIIC">
  <defs>
    <style>
      .bg    { fill: #0E1B2A; }
      .ttl   { fill: #E8F0FA; font: 700 30px Helvetica, Arial, sans-serif; }
      .sub   { fill: #7E93AB; font: 400 17px Helvetica, Arial, sans-serif; }
      .chip  { fill: #16293D; stroke: #2B4761; stroke-width: 2; }
      .chipT { fill: #BBCBDD; font: 600 15px Helvetica, Arial, sans-serif; text-anchor: middle; }
      .conn  { stroke: #2B4761; stroke-width: 2; }
      .card  { fill: #16293D; stroke: #2B4761; stroke-width: 2; }
      .cardA { fill: #152F4A; stroke: #5BA8F5; stroke-width: 2.5; }
      .tag   { fill: #7E93AB; font: 600 12px Helvetica, Arial, sans-serif; letter-spacing: 1.4px; }
      .tagA  { fill: #5BA8F5; font: 600 12px Helvetica, Arial, sans-serif; letter-spacing: 1.4px; }
      .big   { fill: #E8F0FA; font: 700 62px Helvetica, Arial, sans-serif; }
      .bigA  { fill: #8FD0A8; font: 700 62px Helvetica, Arial, sans-serif; }
      .lbl   { fill: #9DB2C8; font: 400 15px Helvetica, Arial, sans-serif; }
      .val   { fill: #E8F0FA; font: 600 15px Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="675" rx="16" />

  <text class="ttl" x="60" y="68">Efficience du processus : de 0,45 % à 8 %</text>
  <text class="sub" x="60" y="98">Projet de certification Ceinture verte Lean Six Sigma · méthodologie DMAIIC</text>

  <!-- phases DMAIIC -->
  <line class="conn" x1="200" y1="186" x2="248" y2="186" />
  <line class="conn" x1="384" y1="186" x2="432" y2="186" />
  <line class="conn" x1="568" y1="186" x2="616" y2="186" />
  <line class="conn" x1="752" y1="186" x2="800" y2="186" />
  <line class="conn" x1="936" y1="186" x2="984" y2="186" />

  <rect class="chip" x="60"   y="158" width="144" height="56" rx="10" />
  <text class="chipT" x="132"  y="192">Définir</text>
  <rect class="chip" x="244"  y="158" width="144" height="56" rx="10" />
  <text class="chipT" x="316"  y="192">Mesurer</text>
  <rect class="chip" x="428"  y="158" width="144" height="56" rx="10" />
  <text class="chipT" x="500"  y="192">Analyser</text>
  <rect class="chip" x="612"  y="158" width="144" height="56" rx="10" />
  <text class="chipT" x="684"  y="192">Innover</text>
  <rect class="chip" x="796"  y="158" width="144" height="56" rx="10" />
  <text class="chipT" x="868"  y="192">Implanter</text>
  <rect class="chip" x="980"  y="158" width="160" height="56" rx="10" />
  <text class="chipT" x="1060" y="192">Contrôler</text>

  <!-- avant -->
  <rect class="card" x="60" y="282" width="520" height="268" rx="14" />
  <text class="tag" x="92" y="320">AVANT</text>
  <text class="big" x="92" y="396">0,45 %</text>
  <text class="lbl" x="92" y="432">Efficience du processus (VA / DEP)</text>
  <line class="conn" x1="92" y1="456" x2="548" y2="456" />
  <text class="lbl" x="92" y="488">Valeur ajoutée</text>
  <text class="val" x="400" y="488">140 min</text>
  <text class="lbl" x="92" y="518">Durée totale du processus</text>
  <text class="val" x="400" y="518">30 455 min</text>

  <!-- apres -->
  <rect class="cardA" x="620" y="282" width="520" height="268" rx="14" />
  <text class="tagA" x="652" y="320">APRÈS</text>
  <text class="bigA" x="652" y="396">8 %</text>
  <text class="lbl" x="652" y="432">Efficience du processus (VA / DEP)</text>
  <line class="conn" x1="652" y1="456" x2="1108" y2="456" />
  <text class="lbl" x="652" y="488">Valeur ajoutée</text>
  <text class="val" x="960" y="488">140 min</text>
  <text class="lbl" x="652" y="518">Durée totale du processus</text>
  <text class="val" x="960" y="518">1 760 min</text>

  <text class="sub" x="60" y="614">La valeur ajoutée est restée identique : c'est l'attente éliminée qui fait tout l'écart.</text>
</svg>
