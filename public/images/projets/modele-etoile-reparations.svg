<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Schéma illustratif d'un modèle en étoile pour le suivi des réparations">
  <defs>
    <style>
      .bg   { fill: #0E1B2A; }
      .ttl  { fill: #E8F0FA; font: 700 30px Helvetica, Arial, sans-serif; }
      .sub  { fill: #7E93AB; font: 400 17px Helvetica, Arial, sans-serif; }
      .card { fill: #16293D; stroke: #2B4761; stroke-width: 2; }
      .fact { fill: #152F4A; stroke: #5BA8F5; stroke-width: 2.5; }
      .ctag { fill: #7E93AB; font: 600 11px Helvetica, Arial, sans-serif; letter-spacing: 1.2px; }
      .cnam { fill: #E8F0FA; font: 700 18px Helvetica, Arial, sans-serif; }
      .fld  { fill: #9DB2C8; font: 400 13px Helvetica, Arial, sans-serif; }
      .mes  { fill: #8FD0A8; font: 400 13px Helvetica, Arial, sans-serif; }
      .lnk  { stroke: #2B4761; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="675" rx="16" />

  <text class="ttl" x="60" y="74">Modèle en étoile — suivi des réparations</text>
  <text class="sub" x="60" y="104">Schéma illustratif · une table de faits, quatre dimensions</text>

  <!-- liaisons (tracées avant les cartes) -->
  <line class="lnk" x1="340" y1="275" x2="600" y2="385" />
  <line class="lnk" x1="860" y1="275" x2="600" y2="385" />
  <line class="lnk" x1="340" y1="520" x2="600" y2="420" />
  <line class="lnk" x1="860" y1="520" x2="600" y2="420" />

  <!-- dimension : date -->
  <rect class="card" x="220" y="200" width="240" height="106" rx="10" />
  <text class="ctag" x="240" y="226">DIMENSION</text>
  <text class="cnam" x="240" y="250">Date</text>
  <text class="fld"  x="240" y="274">Jour · Semaine · Mois</text>
  <text class="fld"  x="240" y="294">Année scolaire</text>

  <!-- dimension : appareil -->
  <rect class="card" x="740" y="200" width="240" height="106" rx="10" />
  <text class="ctag" x="760" y="226">DIMENSION</text>
  <text class="cnam" x="760" y="250">Appareil</text>
  <text class="fld"  x="760" y="274">Modèle · Âge</text>
  <text class="fld"  x="760" y="294">Type de bris</text>

  <!-- table de faits -->
  <rect class="fact" x="470" y="300" width="260" height="140" rx="12" />
  <text class="ctag" x="494" y="330" style="fill:#5BA8F5">TABLE DE FAITS</text>
  <text class="cnam" x="494" y="356">Réparations</text>
  <text class="mes"  x="494" y="382">Délai de traitement</text>
  <text class="mes"  x="494" y="402">Volume en file</text>
  <text class="mes"  x="494" y="422">Conformité FIFO</text>

  <!-- dimension : établissement -->
  <rect class="card" x="220" y="440" width="240" height="106" rx="10" />
  <text class="ctag" x="240" y="466">DIMENSION</text>
  <text class="cnam" x="240" y="490">Établissement</text>
  <text class="fld"  x="240" y="514">École · Secteur</text>
  <text class="fld"  x="240" y="534">Ordre d'enseignement</text>

  <!-- dimension : statut -->
  <rect class="card" x="740" y="440" width="240" height="106" rx="10" />
  <text class="ctag" x="760" y="466">DIMENSION</text>
  <text class="cnam" x="760" y="490">Statut</text>
  <text class="fld"  x="760" y="514">Étape du flux</text>
  <text class="fld"  x="760" y="534">File d'attente</text>

  <text class="sub" x="60" y="625">Source : données ITSM · Mesures DAX pour les délais, les volumes et la conformité du processus</text>
</svg>
